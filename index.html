  <body class="bg-slate-100 text-slate-800 antialiased font-['Plus_Jakarta_Sans',sans-serif] select-none">
    <div id="root"></div>
    <script>
      // Clean up service workers in dev environment to prevent caching HTML for module scripts
      if ('serviceWorker' in navigator) {
        if (location.hostname === 'localhost' || location.hostname.includes('run.app') || location.port === '3000') {
          navigator.serviceWorker.getRegistrations().then(regs => {
            for (const reg of regs) reg.unregister();
          });
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW register fail', err));
          });
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
